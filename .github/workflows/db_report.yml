name: DB Report

# Read-only. Prints database size, the largest tables, and NFL-specific row
# counts, so a decision about writing a few hundred MB is made against real
# headroom rather than a guess.
#
# The odds table is capped by data/prune_odds.py; nfl_odds_history deliberately
# is not, so its growth is worth watching here.

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          from data.db import get_connection
          conn = get_connection()
          try:
              size = conn.execute(
                  "SELECT pg_size_pretty(pg_database_size(current_database()))"
              ).fetchone()[0]
              print(f"DATABASE SIZE: {size}\n")
              print("LARGEST TABLES")
              rows = conn.execute("""
                  SELECT c.relname,
                         pg_size_pretty(pg_total_relation_size(c.oid)) AS total,
                         s.n_live_tup
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  LEFT JOIN pg_stat_user_tables s ON s.relid = c.oid
                  WHERE c.relkind = 'r' AND n.nspname = 'public'
                  ORDER BY pg_total_relation_size(c.oid) DESC
                  LIMIT 15
              """).fetchall()
              for r in rows:
                  print(f"  {r[0]:<34} {r[1]:>10}  {r[2] or 0:>12,} rows")
              print("\nNFL TABLES")
              for t in ("nfl_odds_history", "nfl_pick_status_history",
                        "nfl_player_game_log", "picks", "odds"):
                  try:
                      n = conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                      print(f"  {t:<28} {n:>12,} rows")
                  except Exception as e:
                      print(f"  {t:<28} (missing: {str(e)[:50]})")
          finally:
              conn.close()
          PY
