name: Daily Pipeline

# Full pipeline: settle yesterday's picks, ingest injuries/odds/stats/weather, score today's games.
# Runs once at 7am ET as the kickoff. The hourly refresh then resumes at 11am ET (see
# refresh_picks.yml, which fires every hour from 11am to 11pm ET). 8/9/10am are intentionally
# left empty.
#
# 7am run won't generate batter prop picks (lineups don't post until evening) — those fire
# on later hourly refreshes once `lineup_slots` is populated.
#
# Cron is EDT (UTC-4). In Nov when EST starts, both fire one hour earlier than the comment
# label — acceptable for MLB offseason. Update if NHL models go live in winter.
#
# Fires at :17 past the hour (not :00) to avoid the top-of-hour GitHub Actions scheduler
# congestion that delays/drops :00 runs. See refresh_picks.yml for the same rationale.

on:
  schedule:
    - cron: '17 11 * * *'  # 7am EDT / 6am EST (at :17 past the hour)
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: python run_pipeline.py
