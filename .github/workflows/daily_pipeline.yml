name: Daily Pipeline

# Full pipeline: settle yesterday's picks, ingest injuries/odds/stats/weather, score today's games.
# Runs once daily at 7am ET. Mid-day refreshes handled by refresh_picks.yml.
#
# Cron is EDT (UTC-4). In Nov when EST starts, this fires at 8am ET instead of 7am — acceptable
# for MLB offseason. Update to '0 12 * * *' if NHL models go live in winter.

on:
  schedule:
    # Stagger: GitHub Actions cron is best-effort and frequently delays or
    # drops scheduled runs under load. The 30-min backup catches dropped
    # primaries; the pipeline is idempotent (deletes unsettled picks before
    # re-inserting), so a duplicate run is harmless.
    # Long-term: AWS EventBridge will invoke workflow_dispatch directly —
    # see infra/aws_scheduler.yaml. Once that's deployed and verified, drop
    # the schedule: block entirely.
    - cron: '0 11 * * *'   # 7am EDT primary
    - cron: '30 11 * * *'  # 7:30am EDT backup
  workflow_dispatch:        # manual trigger from GitHub UI / EventBridge

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_pipeline.py
