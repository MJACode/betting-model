name: Daily Pipeline

# Full pipeline: settle yesterday's picks, ingest injuries/odds/stats/weather, score today's games.
# Runs twice daily — 9am ET and 11am ET — so game models + pitcher props are visible early.
# The 9am run will not generate batter prop picks (lineups don't post until evening); those
# fire on the 11am run + later refreshes once `lineup_slots` is populated.
#
# Both runs set FETCH_F5_LIVE=1, so DK F5 odds are fetched twice/day (~45 Odds API credits
# extra per day). The 11am fetch overwrites the 9am one. Prop odds are also fetched twice.
# This is an accepted tradeoff for earlier visibility — refreshes after 11am do NOT re-fetch
# F5 or prop odds, they lock to the latest morning snapshot.
#
# Crons are EDT (UTC-4). In Nov when EST starts, both fire one hour earlier than the comment
# label — acceptable for MLB offseason. Update if NHL models go live in winter.

on:
  schedule:
    - cron: '0 13 * * *'  # 9am EDT / 8am EST
    - cron: '0 15 * * *'  # 11am EDT / 10am EST
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: python run_pipeline.py
