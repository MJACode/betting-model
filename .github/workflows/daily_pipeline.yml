name: Daily Pipeline

# Full pipeline: settle yesterday's picks, ingest injuries/odds/stats/weather, score today's games.
# Runs once at 8am ET as the kickoff for the hourly refresh schedule (see refresh_picks.yml,
# which fires every hour from 9am to 11pm ET).
#
# 8am run won't generate batter prop picks (lineups don't post until evening) — those fire
# on later hourly refreshes once `lineup_slots` is populated.
#
# Cron is EDT (UTC-4). In Nov when EST starts, both fire one hour earlier than the comment
# label — acceptable for MLB offseason. Update if NHL models go live in winter.

on:
  schedule:
    - cron: '0 12 * * *'  # 8am EDT / 7am EST
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: python run_pipeline.py
