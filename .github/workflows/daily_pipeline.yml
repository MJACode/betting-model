name: Daily Pipeline

# Full pipeline: settle yesterday's picks, ingest injuries/odds/stats/weather, score today's games.
#
# SCHEDULING MOVED OFF GITHUB ACTIONS (2026-07). The daily 6am ET run is now triggered by
# scheduler.py on the always-on cloud worker (see docs/cloud_worker.md) — the Actions cron
# was removed because the scheduled workflows burned ~10k Actions minutes/month against a
# 2,000 cap. This workflow is kept as a manual break-glass fallback (Run workflow button).
# To run the full pipeline here on demand: Actions -> Daily Pipeline -> Run workflow.
#
# 6am run won't generate batter prop picks (lineups don't post until evening) — those fire
# on later refreshes once `lineup_slots` is populated.

on:
  workflow_dispatch:        # manual trigger only; scheduling lives in scheduler.py

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: python run_pipeline.py
