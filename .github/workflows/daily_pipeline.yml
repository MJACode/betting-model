name: Daily Pipeline

# Full pipeline: settle yesterday's picks, ingest injuries/odds/stats/weather, score today's games.
# Runs once daily at 11am ET. This is the ONLY run that fetches live F5 odds
# (FETCH_F5_LIVE=1) — F5 markets cost ~45 API credits per fetch via the per-event
# endpoint, so we only do it once per day. Mid-day refreshes (refresh_picks.yml)
# re-score against the 11am F5 snapshot without re-fetching.
#
# Cron is EDT (UTC-4). In Nov when EST starts, this fires at 10am ET instead of 11am —
# acceptable for MLB offseason. Update to '0 16 * * *' if NHL models go live in winter.

on:
  schedule:
    - cron: '0 15 * * *'  # 11am EDT
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: python run_pipeline.py
