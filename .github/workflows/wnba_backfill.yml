name: WNBA Backfill

# One-shot historical backfill of WNBA games + player box scores + team stats
# via nba_api (stats.nba.com, LeagueID=10). Writes to Supabase through DATABASE_URL.
#
# Trigger manually from the GitHub Actions tab (or mobile app) — there is no
# schedule. Pick the season range with the inputs below (defaults 2019–2025).
#
# Runtime: ~10-20 min depending on rate limiting. nba_api occasionally soft-blocks
# cloud/CI IPs; if this job fails with timeouts/403s from stats.nba.com, re-run it
# (it is idempotent — already-ingested game_ids are skipped) or run the same
# command locally where a residential IP is less likely to be throttled:
#     python -m data.ingestors.wnba_stats_ingestor --backfill 2019 2025

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: 'First season (year of play) to backfill'
        required: true
        default: '2019'
      end_season:
        description: 'Last season (year of play) to backfill'
        required: true
        default: '2025'

jobs:
  backfill:
    runs-on: ubuntu-latest
    # nba_api can be slow under rate limiting — give it room.
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run WNBA backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m data.ingestors.wnba_stats_ingestor \
            --backfill "${{ github.event.inputs.start_season }}" "${{ github.event.inputs.end_season }}"
