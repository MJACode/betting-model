name: Mobile OTA update (production)

# Publishes a JS-only over-the-air Expo Update to the PRODUCTION channel, so
# already-installed TestFlight builds pick up merged mobile/** changes on
# their next two app launches (expo-updates checks at launch, applies on the
# following one) — no 20-30 min EAS build, no Apple processing wait.
#
# Manual-only, like the TestFlight workflow: Actions tab → "Mobile OTA update
# (production)" → Run workflow. Select the branch to publish (normally
# master, after the mobile PR has merged).
#
# WHEN TO USE THIS vs the full TestFlight build (mobile-build.yml):
#   - Use OTA when the change is pure JS/TS (screens, hooks, lib, styles) —
#     which is almost every mobile session.
#   - Use the TestFlight build when the change adds/updates a NATIVE module
#     (a new dep with native code, expo-notifications enablement, app.json
#     native config, SDK upgrade). An OTA bundle that imports a native module
#     missing from the installed binary crashes the app on launch.
#   - Runtime match: the update only reaches builds whose runtime version
#     matches. runtimeVersion policy is "appVersion", so the app.json
#     "version" on the branch you publish from must equal the installed
#     build's version (currently 1.0.0). If you bump the version for a new
#     binary, older installs stop receiving these updates by design.
#
# Uses the same EXPO_TOKEN secret as the preview + TestFlight workflows.

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message (shown in the EAS dashboard)'
        required: false
        default: 'OTA update from GitHub Actions'

concurrency:
  group: mobile-ota-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish EAS Update to production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set (Settings → Secrets → Actions)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Publish EAS Update (production channel)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --channel production \
            --message "${{ github.event.inputs.message }}" \
            --non-interactive

      - name: Summary
        run: |
          {
            echo "## OTA update published to the production channel"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA::7}\`"
            echo "- Message: ${{ github.event.inputs.message }}"
            echo
            echo "Installed TestFlight builds download it on the next app launch"
            echo "and apply it on the launch after that (force-quit the app twice"
            echo "to see it immediately)."
          } >> "$GITHUB_STEP_SUMMARY"
