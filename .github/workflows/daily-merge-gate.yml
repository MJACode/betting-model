# Fail while a daily pipeline run is open, so a merge does not redeploy
# the Railway worker on top of it.
#
# The status is "Daily pipeline gate / daily pipeline not running".
# It blocks merges only after that check is required on master
# (Settings → Rules → master → required status checks). The job itself
# cannot mark itself required.
#
# Source of truth: pipeline_runs, run_kind = daily, finished_at IS NULL,
# started_at::timestamptz within the last 75 minutes. Without
# DATABASE_URL the job falls back to 06:00–07:15 America/New_York.
#
# Emergency: label the PR emergency-merge, or put bypass-daily-gate in
# the PR body and re-run this check. See tracking/daily_merge_gate.py.
name: Daily pipeline gate

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      bypass:
        description: "Pass even if a daily is running (emergency)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  daily-not-running:
    name: daily pipeline not running
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Postgres client library
        run: python -m pip install psycopg2-binary

      - name: Block the merge while a daily run is open
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # pull_request has no inputs context. Short-circuit keeps that path off it.
          DAILY_GATE_BYPASS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bypass == 'true' && '1' || '0' }}
        run: python -m tracking.daily_merge_gate
