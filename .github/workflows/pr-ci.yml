# Non-integration pytest subset on every pull request.
#
# No live Odds API, no prod DATABASE_URL. Pure / SQLite-fixture tests only:
# smoke (config + freeze guard), lock, settle, freshness, leakage,
# threshold-parity (+ generated mobile thresholds --check).
#
# Full suite remains a hand run: python -m pytest -q tests/
name: PR CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-tsc:
    # Own job so a baseline mismatch cannot skip the pytest subset.
    # Stricter than mobile-ota.yml on purpose. OTA ignores queries.ts and every scripts/
    # file (harnesses are not in the bundle). This job fails a new diagnostic
    # anywhere tsc reports one, including inside queries.ts. scripts/ entries in
    # mobile/tsc-baseline.txt are file + TS code only, so a new field on Pick /
    # ParlayLeg / TrackRecordSummary does not fail an unrelated PR. A baseline
    # entry tsc no longer reports warns and does not fail. #846's
    # mobile/ci/tsc-baseline.txt is a different gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile against the known-error baseline
        working-directory: mobile
        run: |
          npx tsc --noEmit > tsc.log 2>&1 || true
          python3 scripts/check_tsc_baseline.py tsc.log tsc-baseline.txt

      # The pytest job does not npm ci, so a verify script that needs tsx
      # skips there. This job already installed mobile deps. Same role as
      # the pytest files that shell out to mobile/scripts/verify_*.ts.
      - name: Paused catalog
        working-directory: mobile
        run: npx tsx scripts/verify_paused_catalog.ts

      # Same reason as the step above: the pytest job does not npm ci, so a
      # verify script it shells out to skips there. This one has to fail the
      # PR. verify_line_legs exits 1 on any failed check.
      - name: Line legs
        working-directory: mobile
        run: npx tsx scripts/verify_line_legs.ts

      # Same skip as the two steps above. The scoreboard checks cover the
      # live-line split rule; pytest-subset does not npm ci.
      - name: Scoreboard
        working-directory: mobile
        run: npx tsx scripts/verify_scoreboard.ts

  pytest-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Scratch-cluster tests (tests/byom_scratch.py and the discord void
      # notice) shell out to initdb. The runner has no Postgres until this
      # step; without it those tests skip and CI never applies the SQL.
      - name: Install Postgres for scratch-cluster tests
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql

      - name: Install minimal test deps
        run: |
          python -m pip install -U pip
          # Full requirements.txt pulls heavy ML stacks; the subset below
          # only needs pytest + the modules those tests import. Install the
          # declared test pin and the light runtime deps config/scorer need.
          python -m pip install "pytest>=8.0.0" python-dotenv numpy pandas loguru psycopg2-binary requests scipy joblib scikit-learn xgboost-cpu optuna apscheduler beautifulsoup4
          # tests/test_nba_injury_report.py parses real report PDFs (requirements.txt pin).
          python -m pip install "pdfplumber>=0.11.0"

      - name: Mobile thresholds drift check
        run: python -m scripts.generate_mobile_thresholds --check

      # Offline NFL wiring checks (no DB, no API credits): the #838 lock
      # checks allow only an unsettled-NONE delete in the publishers. --ci:
      # the DATA section (schedule coverage, odds cache) warns instead of
      # failing, so the step doesn't go red when the committed schedule ends.
      - name: NFL preflight
        run: python -m scripts.nfl_preflight --ci

      # test_discord_publish_sync runs the app predicate with
      # node --experimental-strip-types. The runner image's node is not
      # that, and a missing flag fails the subset. npm ci for tsc is the
      # mobile-tsc job, not this one.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pytest non-integration subset
        env:
          # Ensure no accidental prod URL from a fork secret leak path.
          DATABASE_URL: ""
          ODDS_API_KEY: ""
          SUPABASE_URL: ""
          SUPABASE_KEY: ""
        run: |
          python -m pytest -q -rs \
            tests/test_config.py \
            tests/test_claude_settings_allowlist.py \
            tests/test_mlb_retrain_freeze.py \
            tests/test_retired_models.py \
            tests/test_mobile_threshold_parity.py \
            tests/test_mobile_bankroll.py \
            tests/test_nfl_prop_thresholds.py \
            tests/test_pick_lock_is_on_picks.py \
            tests/test_pick_lock_survives_settlement.py \
            tests/test_publisher_lock.py \
