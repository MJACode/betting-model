name: Refresh Picks

# Re-fetch odds and re-score picks every hour from 11am through 11pm ET.
# Together with daily_pipeline.yml (which runs the full pipeline at 7am ET), picks refresh
# at 7am and then hourly 11am-11pm ET. 8/9/10am are intentionally left empty.
#
# Each hourly run fetches full-game odds + F5 odds (FETCH_F5_LIVE=1) + player prop odds +
# lineups, then re-scores game and prop models. Settlement, stats, weather, and injuries
# only run in the 7am daily pipeline.
#
# Crons are EDT (UTC-4). In Nov when EST starts, times shift 1 hour later — acceptable
# for MLB offseason.
#
# NOTE: runs fire at :17 past the hour, NOT :00. GitHub Actions scheduled workflows are
# best-effort and the top of the hour is the most heavily contended slot across all of
# GitHub — runs at :00 get delayed and frequently dropped entirely, which made the
# hourly schedule effectively run only every ~2 hours. Moving to an off-peak minute
# (:17) substantially improves the chance every hourly run actually fires.

on:
  schedule:
    - cron: '17 15-23 * * *'  # 11am - 7pm EDT (9 runs, at :17 past the hour)
    - cron: '17 0-3 * * *'    # 8pm - 11pm EDT (4 runs, at :17 past the hour)
  workflow_dispatch:           # manual trigger from GitHub mobile / UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh odds, lineups, and regenerate picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: |
          python run_pipeline.py --step odds
          python run_pipeline.py --step prop-odds
          python run_pipeline.py --step wnba-prop-odds
          python run_pipeline.py --step nba-prop-odds
          python run_pipeline.py --step lineups
          python run_pipeline.py --step public-betting
          python run_pipeline.py --step scoring
          python run_pipeline.py --step prop-scoring
          python run_pipeline.py --step wnba-prop-scoring
          python run_pipeline.py --step nba-prop-scoring
          # Golf data + scoring run last so a DataGolf hiccup can never abort the
          # bash -e chain before game/prop picks are scored above.
          python run_pipeline.py --step golf-field
          python run_pipeline.py --step golf-odds
          python run_pipeline.py --step golf-scoring
