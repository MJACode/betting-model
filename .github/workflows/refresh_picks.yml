name: Refresh Picks

# One refresh pass: re-fetch odds and re-score picks (scripts/refresh_pass.sh).
#
# SCHEDULING MOVED OFF GITHUB ACTIONS (2026-07). The hourly 7am-5pm ET refresh cadence is
# now driven by scheduler.py on the always-on cloud worker (see docs/cloud_worker.md) — the
# Actions cron was removed because the scheduled workflows burned ~10k Actions minutes/month
# against a 2,000 cap. This workflow is kept as a manual break-glass fallback: to run a
# single refresh pass on demand, Actions -> Refresh Picks -> Run workflow.

on:
  workflow_dispatch:           # manual trigger only; scheduling lives in scheduler.py

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh odds, lineups, and regenerate picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: bash scripts/refresh_pass.sh
