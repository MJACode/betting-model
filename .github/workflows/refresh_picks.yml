name: Refresh Picks

# Re-fetch odds and re-score picks when lines move throughout the day.
# Only runs odds + scoring (not settle/injuries/stats/weather).
#
# Cron is EDT (UTC-4). In Nov when EST starts, times shift 1 hour later — acceptable
# for MLB offseason.

on:
  schedule:
    # Each slot has a primary + 30-min backup. GitHub Actions cron is
    # best-effort and frequently delays or drops runs under load; the pipeline
    # is idempotent so duplicate triggers are safe. Long-term replacement is
    # AWS EventBridge — see infra/aws_scheduler.yaml.
    - cron: '0 16 * * *'   # 12pm EDT primary
    - cron: '30 16 * * *'  # 12:30pm EDT backup
    - cron: '0 19 * * *'   # 3pm  EDT primary
    - cron: '30 19 * * *'  # 3:30pm EDT backup
    - cron: '0 22 * * *'   # 6pm  EDT primary
    - cron: '30 22 * * *'  # 6:30pm EDT backup
    - cron: '0 0 * * *'    # 8pm  EDT primary
    - cron: '30 0 * * *'   # 8:30pm EDT backup
  workflow_dispatch:         # manual trigger from GitHub mobile / UI / EventBridge

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh odds and regenerate picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python run_pipeline.py --step odds
          python run_pipeline.py --step scoring
