name: Refresh Picks

# Re-fetch odds and re-score picks every hour from 7am through 5pm ET.
# Together with daily_pipeline.yml (full pipeline at 6am ET) and evening_lines.yml
# (every-10-minute refresh loop 6pm-11pm ET), picks refresh hourly 6am-6pm ET and
# then every 10 minutes until 11pm ET.
#
# Each hourly run executes one refresh pass (scripts/refresh_pass.sh): full-game odds +
# F5 odds (FETCH_F5_LIVE=1) + player prop odds + lineups, then re-scores game and prop
# models. Settlement, stats, weather, and injuries only run in the 6am daily pipeline.
#
# Crons are EDT (UTC-4). In Nov when EST starts, times shift 1 hour later — acceptable
# for MLB offseason.
#
# NOTE: runs fire at :17 past the hour, NOT :00. GitHub Actions scheduled workflows are
# best-effort and the top of the hour is the most heavily contended slot across all of
# GitHub — runs at :00 get delayed and frequently dropped entirely, which made the
# hourly schedule effectively run only every ~2 hours. Moving to an off-peak minute
# (:17) substantially improves the chance every hourly run actually fires.

on:
  schedule:
    - cron: '17 11-21 * * *'  # 7am - 5pm EDT (11 runs, at :17 past the hour)
  workflow_dispatch:           # manual trigger from GitHub mobile / UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh odds, lineups, and regenerate picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: bash scripts/refresh_pass.sh
