name: Refresh Picks

on:
  schedule:
    # All times Eastern — EDT (UTC-4) in effect Apr-Nov, EST (UTC-5) Nov-Mar
    - cron: '0 16 * * *'   # 12pm ET (noon)
    - cron: '0 18 * * *'   # 2pm ET
    - cron: '0 22 * * *'   # 6pm ET
    - cron: '0 0 * * *'    # 8pm ET  ← midnight UTC = 8pm EDT
  workflow_dispatch:         # manual trigger from GitHub mobile / UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh odds and regenerate picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python run_pipeline.py --step odds
          python run_pipeline.py --step scoring
