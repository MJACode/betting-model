name: Refresh Picks

# Re-fetch odds and re-score picks every hour from 9am through 11pm ET.
# Together with daily_pipeline.yml (which runs at 8am ET), picks refresh hourly 8am-11pm ET.
#
# Each hourly run fetches full-game odds + F5 odds (FETCH_F5_LIVE=1) + player prop odds +
# lineups, then re-scores game and prop models. Settlement, stats, weather, and injuries
# only run in the 8am daily pipeline.
#
# Crons are EDT (UTC-4). In Nov when EST starts, times shift 1 hour later — acceptable
# for MLB offseason.

on:
  schedule:
    - cron: '0 13-23 * * *'  # 9am - 7pm EDT  (11 runs)
    - cron: '0 0-3 * * *'    # 8pm - 11pm EDT (4 runs)
  workflow_dispatch:           # manual trigger from GitHub mobile / UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh odds, lineups, and regenerate picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: |
          python run_pipeline.py --step odds
          python run_pipeline.py --step prop-odds
          python run_pipeline.py --step wnba-prop-odds
          python run_pipeline.py --step lineups
          python run_pipeline.py --step public-betting
          python run_pipeline.py --step scoring
          python run_pipeline.py --step prop-scoring
          python run_pipeline.py --step wnba-prop-scoring
