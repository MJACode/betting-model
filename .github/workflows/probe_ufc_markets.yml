# TEMPORARY, SELF-DISABLING probe. Delete once the question is answered.
#
# Settles whether The Odds API exposes a method-of-victory market for
# DraftKings. The dev sandbox cannot reach api.the-odds-api.com (egress proxy
# 403) and holds no key, so this runs where both exist. Push-triggered rather
# than workflow_dispatch because the session token cannot dispatch workflows
# (403, documented since session 93).
#
# Read-only: it makes GET requests to the odds feed and writes nothing.
# Cost: ~20 requests against the Odds API quota (~4.5M remaining), <1 min of
# Actions time.
name: Probe UFC markets

on:
  push:
    branches: [claude/discord-webhooks-railway-sucub7]
    paths:
      - 'scripts/probe_ufc_markets.py'
      - '.github/workflows/probe_ufc_markets.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe DraftKings MMA markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::error::ODDS_API_KEY secret is not set on this repo."
            echo "Actions secrets were described as break-glass in session 103;"
            echo "if they were cleared, run this locally instead:"
            echo "  python -m scripts.probe_ufc_markets --all"
            exit 1
          fi
          python -m scripts.probe_ufc_markets --all
