name: Tests

# The repo had NO test CI: all ten other workflows are pipeline/deploy jobs, so
# nothing ever ran pytest automatically and PRs merged with zero checks. This
# fills that gap.
#
# ACTIONS MINUTES: this is cheap and stays cheap because it is event-driven,
# not scheduled. A few minutes per push/PR against the 2,000/month cap. The
# 2026-07 blow-out that moved scheduling off Actions was caused by CRON
# workflows firing all day — deliberately not what this is. Do not add a
# `schedule:` trigger here.
#
# Tests only. No DATABASE_URL, no API keys: everything here runs against fakes
# and fixtures, so a green run means the logic is sound, not that production is
# reachable.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The NFL suite is the gate: it must stay green. Split out from the rest
      # so a failure here is unambiguous rather than buried in a long run.
      - name: NFL suite
        run: |
          python -m pytest -q \
            tests/test_nfl_opener.py \
            tests/test_nfl_pick_monitor.py \
            tests/test_nfl_wind_publisher.py \
            tests/test_nfl_line_snapshots.py \
            tests/test_nfl_results_ingestor.py \
            tests/test_nfl_player_stats_ingestor.py

      # Everything else. Reported, and allowed to fail for now: as of
      # 2026-08-22 tests/test_sbr_loader.py fails 17 on a local Python 3.14 run
      # and has not been triaged on 3.12. Tighten this to a hard gate once that
      # is resolved — a permanently-red check trains everyone to ignore CI,
      # which is worse than no check at all.
      - name: Full suite (non-blocking until sbr_loader is triaged)
        continue-on-error: true
        run: python -m pytest -q tests/
