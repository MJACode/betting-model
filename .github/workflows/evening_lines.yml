name: Evening Fast Lines

# Every-10-minute refresh from 6pm through ~11pm ET — the prime betting window when
# lineups post and lines move fastest.
#
# SCHEDULING MOVED OFF GITHUB ACTIONS (2026-07). This used to fire 5 hourly jobs a night,
# each HOLDING A RUNNER ~55 MIN via an internal sleep loop — ~8,000 Actions minutes/month
# on its own (the single biggest reason the 2,000-minute cap was blown). The evening
# every-10-minute cadence is now a plain */10 cron in scheduler.py on the always-on cloud
# worker (see docs/cloud_worker.md), which costs nothing per idle minute.
#
# This workflow is kept as a manual break-glass fallback that runs ONE refresh pass on
# demand (the runner-holding loop is gone): Actions -> Evening Fast Lines -> Run workflow.

on:
  workflow_dispatch:           # manual trigger only; scheduling lives in scheduler.py

# A delayed or long-running run queues the next one instead of double-fetching.
concurrency:
  group: evening-lines
  cancel-in-progress: false

jobs:
  fast-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Break-glass: run ONE refresh pass. The old runner-holding 6-pass sleep loop is
      # gone (it was the main Actions-minutes drain); the every-10-min evening cadence
      # now lives in scheduler.py on the cloud worker.
      - name: Refresh pass (single)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          FETCH_F5_LIVE: "1"
        run: bash scripts/refresh_pass.sh
