name: WNBA backlog one-shot

# TEMPORARY — settle the 7/5-7/10 WNBA backlog now instead of waiting for the
# next 6am daily pipeline. Fires on push to the fix branch (workflow_dispatch
# isn't available to the session token). Runs the fixed ESPN results ingest
# (14-day self-heal window) and then settlement (trailing 14-day windows).
# DELETE THIS FILE after the backlog run completes.

on:
  push:
    branches:
      - claude/pause-pitcher-er-walks-d0xyhc
    paths:
      - '.github/workflows/wnba_backlog_oneshot.yml'

jobs:
  wnba-backlog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest WNBA results (ESPN, self-heal window)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_pipeline.py --step wnba-results

      - name: Settle picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run_pipeline.py --step settle
