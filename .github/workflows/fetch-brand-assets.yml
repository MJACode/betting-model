# Fetch the @signalbasepicks X profile image + banner into mobile/assets/brand/.
#
# WHY A WORKFLOW. The dev sandbox cannot reach x.com or pbs.twimg.com; the
# Railway worker can (scripts/fetch_brand_avatar.py parks the bytes in the
# brand_assets table), but the read-only Supabase MCP hands them back as base64
# in a chat window, and 20 KB of base64 retyped by hand does not survive the
# trip. A runner has open egress AND can commit, so the bytes never pass
# through anyone's keyboard. Commits back to the branch it ran on.
name: Fetch brand assets

on:
  # workflow_dispatch is refused to the GitHub integration a Claude session
  # holds (403 "Resource not accessible by integration"), so this fires on a
  # push of THIS FILE to the branch instead. Edit the URLs/hashes below and
  # push; the bot's own commit touches only mobile/assets/brand, and pushes
  # made with GITHUB_TOKEN never re-trigger workflows, so it cannot loop.
  push:
    branches: ['claude/logo-color-patterns-update-hxmr52']
    paths: ['.github/workflows/fetch-brand-assets.yml']

env:
  AVATAR_URL: https://pbs.twimg.com/profile_images/2094603716825321472/TNo_IOfm.jpg
  BANNER_URL: https://pbs.twimg.com/profile_banners/2094099089822531584/1788118988
  # SHA-256 the worker recorded in brand_assets (scripts/fetch_brand_avatar.py).
  AVATAR_SHA256: 71012171cd27f9f49c08e98f9f6d62badcd9e95bcb94ff567d0f2352d3b07b98
  BANNER_SHA256: 67969960b57854f44bf6969010ddabee9661730ab331b7a1ae8113656783791d

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download
        run: |
          set -euo pipefail
          mkdir -p mobile/assets/brand
          curl -fsSL "$AVATAR_URL" -o mobile/assets/brand/x_avatar.jpg
          curl -fsSL "$BANNER_URL" -o mobile/assets/brand/x_banner.png
          file mobile/assets/brand/x_avatar.jpg mobile/assets/brand/x_banner.png
          check() {
            [ -z "$2" ] && return 0
            got=$(sha256sum "$1" | cut -d' ' -f1)
            if [ "$got" != "$2" ]; then echo "$1: sha256 $got != expected $2"; exit 1; fi
            echo "$1: sha256 verified"
          }
          check mobile/assets/brand/x_avatar.jpg "$AVATAR_SHA256"
          check mobile/assets/brand/x_banner.png "$BANNER_SHA256"

      - name: Commit back to the branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/brand
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Brand assets: @signalbasepicks profile image and banner, fetched by workflow"
          git push origin HEAD:${{ github.ref_name }}
