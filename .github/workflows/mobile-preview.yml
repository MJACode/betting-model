name: Mobile preview

# Auto-publishes an Expo Update on every PR.
# Posts a sticky comment with a QR code + shareable Expo Go link.
#
# One-time setup (see mobile/README.md for full steps):
#   1. cd mobile && eas init            (creates project + writes projectId to app.json)
#   2. cd mobile && eas update:configure (writes runtimeVersion + updates URL)
#   3. Add EXPO_TOKEN secret in repo Settings → Secrets → Actions
#
# Until setup is done, this workflow posts a setup-needed comment on the PR
# instead of silently failing.

on:
  pull_request:

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish EAS Update preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check setup
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "status=no-token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PROJECT_ID=$(node -p "(require('./mobile/app.json').expo?.extra?.eas?.projectId || '').trim()" 2>/dev/null || echo "")
          if [ -z "$PROJECT_ID" ]; then
            echo "status=no-project" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=ready" >> "$GITHUB_OUTPUT"
          echo "Project ID: $PROJECT_ID"

      - name: Post setup-needed comment
        if: steps.check.outputs.status != 'ready'
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.check.outputs.status }}
        with:
          script: |
            const status = process.env.STATUS;
            const reasons = {
              'no-token':   '- ❌ The `EXPO_TOKEN` secret is not set in repository settings',
              'no-project': '- ❌ The Expo project ID is not configured in `mobile/app.json`',
            };
            const body = [
              '<!-- mobile-preview-setup -->',
              '## Mobile preview — setup needed',
              '',
              "The EAS Update workflow can't publish a preview yet because:",
              '',
              reasons[status] || `- ❌ ${status}`,
              '',
              '### One-time setup',
              '',
              '1. Install EAS CLI: `npm install -g eas-cli`',
              '2. Log in: `eas login` (creates a free expo.dev account if needed)',
              '3. Initialize the project: `cd mobile && eas init`',
              '4. Configure updates: `cd mobile && eas update:configure`',
              '5. Commit the changes to `mobile/app.json`',
              '6. Create an access token at https://expo.dev/settings/access-tokens',
              '7. Add it as `EXPO_TOKEN` in **Settings → Secrets and variables → Actions**',
              '',
              'After that, every PR touching `mobile/**` will publish a fresh preview here.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const tag = '<!-- mobile-preview-setup -->';
            const existing = comments.data.find((c) => c.body && c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Setup Node
        if: steps.check.outputs.status == 'ready'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        if: steps.check.outputs.status == 'ready'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.check.outputs.status == 'ready'
        working-directory: mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Publish EAS Update + comment on PR
        if: steps.check.outputs.status == 'ready'
        uses: expo/expo-github-action/preview@v8
        with:
          working-directory: mobile
          command: eas update --auto --non-interactive
          comment: true
