name: NFL Props Setup

# Everything the NFL prop models need, run where Supabase and The Odds API are
# actually reachable. Modes are separate because they have very different costs:
# the nflverse steps are free, the prop-odds steps spend Odds API credits, and
# the training step is the slow one.
#
#   schema        apply the modelling migration (idempotent)
#   data          nflverse backfill: player log, team-game context, snap counts
#   train         train the 12 prop models on 2015-2024, holdout 2025
#   odds-probe    ONE historical date, a few events — reports MEASURED credit
#                 cost per event so the full backfill is priced, not guessed
#   odds-backfill historical prop lines across a season range
#   odds-live     the upcoming slate's live prop prices
#   report        row counts, so state is visible without a second workflow

# TRIGGER. workflow_dispatch is the normal way in (Actions -> NFL Props Setup),
# but a workflow only appears in that UI once it is on the default branch. Until
# this merges, the run is fired by committing a mode into
# .github/nfl_props_trigger.txt — the path filter means nothing else on this
# branch can start it by accident.
#
# THIS WRITES TO PRODUCTION SUPABASE, from a feature branch, the same way
# db_migrate.yml does. Every write is additive and idempotent: CREATE TABLE IF
# NOT EXISTS, ADD COLUMN IF NOT EXISTS, and upserts into tables this branch
# introduces. Nothing is dropped and no existing row is deleted.
on:
  push:
    branches: [claude/nfl-prop-models-ksa4zl]
    paths: ['.github/nfl_props_trigger.txt']
  workflow_dispatch:
    inputs:
      mode:
        description: which step to run
        required: true
        default: report
        type: choice
        options: [schema, data, train, odds-probe, odds-backfill, odds-live, backtest, report]
      seasons:
        description: 'season range for data/odds-backfill, e.g. "2015 2026"'
        required: false
        default: ''
      probe_date:
        description: 'odds-probe: a past NFL game date, e.g. 2024-10-06'
        required: false
        default: ''
      limit_events:
        description: 'cap events per date (odds-probe / odds-backfill)'
        required: false
        default: ''
      markets:
        description: 'restrict odds pulls to these market keys (space separated)'
        required: false
        default: ''

concurrency:
  group: nfl-props-setup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The train mode commits the trained .pkl back. Without this the runner
    # token is read-only, every push is rejected, and the models end up
    # registered in model_registry with no artifact for load_model to find.
    permissions:
      contents: write
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Resolve mode
        id: cfg
        run: |
          MODE="${{ inputs.mode }}"
          SEASONS="${{ steps.cfg.outputs.seasons }}"
          PROBE="${{ steps.cfg.outputs.probe_date }}"
          LIMIT="${{ steps.cfg.outputs.limit_events }}"
          if [ -z "$MODE" ] && [ -f .github/nfl_props_trigger.txt ]; then
            # file form: "mode: data" / "seasons: 2015 2026" / "probe_date: ..."
            MODE=$(grep -oP '^mode:\s*\K\S+'        .github/nfl_props_trigger.txt || true)
            SEASONS=$(grep -oP '^seasons:\s*\K.*'    .github/nfl_props_trigger.txt || true)
            PROBE=$(grep -oP '^probe_date:\s*\K\S+' .github/nfl_props_trigger.txt || true)
            LIMIT=$(grep -oP '^limit_events:\s*\K\S+' .github/nfl_props_trigger.txt || true)
            MARKETS=$(grep -oP '^markets:\s*\K.*' .github/nfl_props_trigger.txt || true)
            REGIONS=$(grep -oP '^regions:\s*\K\S+' .github/nfl_props_trigger.txt || true)
            BOOKS=$(grep -oP '^books:\s*\K\S+' .github/nfl_props_trigger.txt || true)
          fi
          [ -z "$MODE" ] && MODE=report
          echo "mode=$MODE"                 >> "$GITHUB_OUTPUT"
          echo "seasons=$SEASONS"           >> "$GITHUB_OUTPUT"
          echo "probe_date=$PROBE"          >> "$GITHUB_OUTPUT"
          echo "limit_events=$LIMIT"        >> "$GITHUB_OUTPUT"
          echo "markets=$MARKETS"           >> "$GITHUB_OUTPUT"
          echo "regions=$REGIONS"           >> "$GITHUB_OUTPUT"
          echo "books=$BOOKS"               >> "$GITHUB_OUTPUT"
          echo "::notice::running mode=$MODE seasons=$SEASONS probe=$PROBE limit=$LIMIT"
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Apply schema
        if: steps.cfg.outputs.mode == 'schema'
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/step.log"
          from data.db import get_connection
          from data.db_setup import _split_sql_statements
          sql = open('data/migrations/add_nfl_prop_modeling_tables.sql').read()
          conn = get_connection()
          # The repo's dollar-quoting-aware splitter, NOT a naive split(';').
          # A naive split silently swallowed the first ALTER (it followed a
          # comment block) and would cut the function body in half at the
          # semicolons inside $$...$$.
          applied = skipped = 0
          for stmt in _split_sql_statements(sql):
              try:
                  conn.execute(stmt); conn.commit(); applied += 1
              except Exception as e:
                  conn.rollback(); skipped += 1
                  print(f"  SKIP {str(e)[:90]} :: {stmt[:60]}")
          print(f"applied={applied} skipped={skipped}")
          cols = [r[0] for r in conn.execute("""
              SELECT column_name FROM information_schema.columns
              WHERE table_name='nfl_player_game_log'""").fetchall()]
          need = ['sacks_suffered','target_share','def_tackles_solo','norm_name','wopr']
          missing = [c for c in need if c not in cols]
          print(f"nfl_player_game_log: {len(cols)} columns; missing={missing}")
          if missing:
              raise SystemExit(f"schema incomplete: {missing}")
          conn.close()
          PY

      - name: nflverse backfill
        if: steps.cfg.outputs.mode == 'data'
        run: |
          RANGE="${{ steps.cfg.outputs.seasons }}"
          [ -z "$RANGE" ] && RANGE="2015 2026"
          set -o pipefail
          python -m data.ingestors.nfl_props_data_ingestor --backfill $RANGE 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Train prop models
        if: steps.cfg.outputs.mode == 'train'
        run: |
          python - <<'PY'
          import json, time
          import optuna; optuna.logging.set_verbosity(optuna.logging.WARNING)
          from models.trainer import train_prop_model
          import config
          out = {}
          for m in [k for k in config.PROP_MODELS if k.startswith('nfl_prop')]:
              t0 = time.time()
              try:
                  r = train_prop_model(m, train_seasons=list(range(2015, 2025)),
                                       holdout_season=2025, n_trials=25)
                  r['secs'] = round(time.time() - t0, 1); out[m] = r
                  print(f"DONE {m}: CalErr={r.get('cal_error')} MAE={r.get('holdout_mae')}", flush=True)
              except Exception as e:
                  out[m] = {'error': f'{type(e).__name__}: {e}'}
                  print(f"FAIL {m}: {e}", flush=True)
          print(json.dumps(out, indent=1, default=str))
          PY

      - name: Commit trained artifacts
        if: steps.cfg.outputs.mode == 'train'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # keep only the newest artifact per model — the registry points at one
          for m in $(python -c "import config;print(' '.join(k for k in config.PROP_MODELS if k.startswith('nfl_prop')))"); do
            ls -1t models/saved/${m}_2*.pkl 2>/dev/null | tail -n +2 | xargs -r git rm -f --ignore-unmatch
          done
          git add -f models/saved/nfl_prop_*.pkl 2>/dev/null || true
          git diff --cached --quiet && { echo "no artifact change"; exit 0; }
          git commit -q -m "Train NFL prop models (workflow run ${{ github.run_id }})"
          # The branch usually moved while a 30-minute training run was going.
          # Without the rebase the push is rejected, the step swallows it, and
          # the models end up registered in model_registry with no .pkl in the
          # repo for load_model to find — trained but unusable.
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep $((5 * i))
          done
          echo "::error::could not push trained artifacts after 3 attempts"
          exit 1

      - name: Prop odds probe (measure the cost before spending)
        if: steps.cfg.outputs.mode == 'odds-probe'
        env:
          # Blank falls back to the config default (us / the five US
          # retail books). Set regions: us,eu to reach Pinnacle.
          ODDS_API_REGIONS: ${{ steps.cfg.outputs.regions }}
          ODDS_API_BOOKMAKERS_PARAM: ${{ steps.cfg.outputs.books }}
        run: |
          D="${{ steps.cfg.outputs.probe_date }}"; [ -z "$D" ] && D="2024-10-06"
          L="${{ steps.cfg.outputs.limit_events }}"; [ -z "$L" ] && L="3"
          set -o pipefail
          python -m data.ingestors.nfl_prop_odds_ingestor --probe "$D" --limit-events "$L" 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Prop odds backfill
        if: steps.cfg.outputs.mode == 'odds-backfill'
        env:
          # Blank falls back to the config default (us / the five US
          # retail books). Set regions: us,eu to reach Pinnacle.
          ODDS_API_REGIONS: ${{ steps.cfg.outputs.regions }}
          ODDS_API_BOOKMAKERS_PARAM: ${{ steps.cfg.outputs.books }}
        run: |
          RANGE="${{ steps.cfg.outputs.seasons }}"; [ -z "$RANGE" ] && RANGE="2023 2025"
          ARGS=""; [ -n "${{ steps.cfg.outputs.limit_events }}" ] && ARGS="--limit-events ${{ steps.cfg.outputs.limit_events }}"
          [ -n "${{ steps.cfg.outputs.markets }}" ] && ARGS="$ARGS --markets ${{ steps.cfg.outputs.markets }}"
          set -o pipefail
          python -m data.ingestors.nfl_prop_odds_ingestor --backfill $RANGE $ARGS 2>&1 | tee "$RUNNER_TEMP/step.log"

      - name: Backtest against real prices
        if: steps.cfg.outputs.mode == 'backtest'
        run: |
          set -o pipefail
          SEA="${{ steps.cfg.outputs.seasons }}"; [ -z "$SEA" ] && SEA="2024 2025"
          python -m models.nfl_prop_backtest --all --seasons $SEA 2>&1 | tee "$RUNNER_TEMP/step.log"
          echo "--- PLACEBO ---" | tee -a "$RUNNER_TEMP/step.log"
          python -m models.nfl_prop_backtest --all --seasons $SEA --placebo 2>&1 | tee -a "$RUNNER_TEMP/step.log"

      - name: Prop odds live
        if: steps.cfg.outputs.mode == 'odds-live'
        run: python -m data.ingestors.nfl_prop_odds_ingestor

      - name: Step tail
        if: always()
        run: |
          # Surface the step's own output as an annotation. Job logs are only
          # readable by tail from the API, and the last thing to run is always
          # the report step, which buries both tracebacks and results.
          if [ -f "$RUNNER_TEMP/step.log" ]; then
            # Prefer the RESULT lines over a blind tail: a 12-model sweep buries
            # them under per-model loading chatter, and the tail then shows only
            # the last two.
            RES=$(grep -aoE '(nfl_prop_[a-z_]+ ?(\[PLACEBO\])?: .*)' "$RUNNER_TEMP/step.log" \
                  | sed 's/\x1b\[[0-9;]*m//g' | tail -c 24000)
            if [ -n "$RES" ]; then
              echo "$RES" | while IFS= read -r l; do echo "::notice::RESULT $l"; done
            else
              echo "::notice::STEP $(tail -n 25 "$RUNNER_TEMP/step.log" | tr '\n' ' ~ ' | tail -c 1800)"
            fi
          fi

      - name: Report
        if: always()
        run: |
          # Emitted as a ::notice:: as well as stdout: annotations are readable
          # from the API in one small call, job logs only by tailing a few
          # hundred lines of runner noise.
          python - <<'PY' > "$RUNNER_TEMP/report.txt" 2>&1 || true
          from data.db import get_connection
          conn = get_connection()
          out = []
          for t in ("nfl_player_game_log", "nfl_team_game_stats", "nfl_snap_counts"):
              try:
                  n = conn.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
                  out.append(f"{t}={n:,}")
              except Exception as e:
                  out.append(f"{t}=MISSING"); conn.rollback()
          try:
              r = conn.execute("""
                  SELECT COUNT(*), COUNT(DISTINCT market), COUNT(DISTINCT bookmaker),
                         COUNT(DISTINCT game_id), MIN(game_date), MAX(game_date)
                  FROM player_prop_odds WHERE game_id LIKE 'NFL%'
              """).fetchone()
              out.append(f"nfl_prop_odds rows={r[0]:,} markets={r[1]} books={r[2]} "
                         f"games={r[3]} dates={r[4]}..{r[5]}")
              # which configured markets never came back — a market with zero
              # rows is either not offered or a wrong key, and the two are
              # indistinguishable without naming them
              got = {x[0] for x in conn.execute(
                  "SELECT DISTINCT market FROM player_prop_odds "
                  "WHERE game_id LIKE 'NFL%'").fetchall()}
              import config as _c
              missing = [m for m in _c.PROP_MARKETS_NFL if m not in got]
              out.append("markets_absent=" + (",".join(missing) if missing else "none"))
          except Exception as e:
              out.append(f"nfl_prop_odds ERR {str(e)[:60]}"); conn.rollback()
          try:
              # coverage: what fraction of each season's games actually got a
              # prop line. An "unresolved event" in the backfill log is only
              # benign if this stays near 100% — a team-name mapping failure and
              # an out-of-window playoff event look identical in that log.
              rows = conn.execute("""
                  SELECT g.season,
                         COUNT(DISTINCT g.game_id) AS games,
                         COUNT(DISTINCT o.game_id) AS with_odds
                  FROM nfl_team_game_stats g
                  LEFT JOIN player_prop_odds o ON o.game_id = g.game_id
                  WHERE g.plays IS NOT NULL AND g.season >= 2023
                  GROUP BY g.season ORDER BY g.season
              """).fetchall()
              out.append("coverage " + " ".join(
                  f"{r[0]}:{r[2]}/{r[1]}" for r in rows))
              # kickoff coverage: the started-game guard reads commence_time
              # from this table, and a NULL means the guard cannot fire — a
              # prop would be scored against an in-play price.
              k = conn.execute("""
                  SELECT season, COUNT(*), COUNT(commence_time)
                  FROM nfl_team_game_stats WHERE season >= 2024
                  GROUP BY season ORDER BY season
              """).fetchall()
              out.append("kickoff " + " ".join(f"{r[0]}:{r[2]}/{r[1]}" for r in k))
          except Exception as e:
              out.append(f"coverage ERR {str(e)[:50]}"); conn.rollback()
          try:
              r = conn.execute("""SELECT COUNT(*) FROM model_registry
                                  WHERE model_id LIKE 'nfl_prop%' AND is_active = 1""").fetchone()
              out.append(f"active_nfl_prop_models={r[0]}")
          except Exception:
              conn.rollback()
          conn.close()
          print(" | ".join(out))
          PY
          cat "$RUNNER_TEMP/report.txt"
          echo "::notice::REPORT $(tr '\n' ' ' < "$RUNNER_TEMP/report.txt" | tail -c 900)"
