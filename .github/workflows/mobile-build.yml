name: Mobile TestFlight build

# Builds the iOS app with the production profile and submits it to
# TestFlight. Manual-only: run on-demand via the "Run workflow" button
# (Actions tab → Mobile TestFlight build → Run workflow) so the push to
# TestFlight is always deliberate. Select the branch you want to build.
#
# One-time setup (in addition to EXPO_TOKEN):
#   1. Register an App Store Connect API key:
#        https://appstoreconnect.apple.com/access/integrations/api
#      Role: Admin (or App Manager). Download the .p8 file.
#   2. Run once from a local machine to upload it to EAS:
#        cd mobile && eas credentials
#        → iOS → production → App Store Connect API key → upload .p8
#      After that, EAS stores it server-side and `eas submit
#      --non-interactive` works from CI.
#   3. Confirm app.json `ios.bundleIdentifier` matches the Bundle ID of the
#      App Store Connect app whose ascAppId is in eas.json.
#
# Build time: ~20-30 min on EAS (build) + ~5 min (submit) + ~15-30 min on
# Apple's side (TestFlight processing) before the build is installable.
#
# EVERY RUN SPENDS ONE iOS BUILD FROM THE EAS PLAN'S MONTHLY ALLOWANCE, and
# when the allowance is gone EAS refuses the build outright — after the
# project archive has uploaded, so the job looks like it is working right up
# until it exits. On 2026-08-30 that produced a run whose only visible verdict
# was "Process completed with exit code 1"; the real line ("This account has
# used its iOS builds from the Free plan this month, which will reset ...")
# was mid-log. The build step now classifies that case and the "Post failure
# note on build failure" step writes it to the tracking issue with the reset
# date. Nothing about it is fixable in code: wait for the reset, ship the
# change over the air instead if it is JS-only (mobile-ota.yml), or upgrade
# the plan — a spend decision, and Matt's alone.
#
# Build numbering: the "Stamp unique iOS build number" step sets
# expo.ios.buildNumber from the workflow run number, so every run uploads a
# strictly higher number than the last (Apple requirement). Do NOT build the
# production profile locally without first bumping expo.ios.buildNumber in
# app.json above the latest TestFlight build — app.json's checked-in value
# is stale by design.
#
# This workflow was deleted in #221 (Actions removed to stop the private-repo
# minutes bill) and restored here. It is workflow_dispatch-only — no cron —
# so it bills runner minutes ONLY when you press "Run workflow", and the
# build itself runs on EAS servers, not the runner. See BUILD_NUMBER_BASE
# below for why the restore needed one change.
#
# Submission failures: `eas submit` prints only a generic "Something went
# wrong" line when EAS returns an errored submission with no structured
# error payload (typically a transient EAS submission-service failure, not
# an Apple rejection — Apple rejections come back with a message the CLI
# prints). The submit step therefore retries once, and on failure the
# "Fetch submission failure details" step pulls the real status/error/logs
# from the EAS GraphQL API and puts them in the job log + tracking issue.

on:
  workflow_dispatch:

concurrency:
  group: mobile-testflight
  cancel-in-progress: false

jobs:
  build:
    name: Build + submit iOS production
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check setup
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set"
            exit 1
          fi

      # Node 22, not 20. eas-cli itself still allows Node >=20, but it pulls
      # @oclif/plugin-autocomplete via a caret range that now resolves to a
      # version requiring Node >=22 — and expo-github-action installs the CLI
      # with yarn, which treats a transitive engine mismatch as a hard error
      # (npm only warns). On Node 20 the "Setup EAS" step dies with:
      #   error @oclif/plugin-autocomplete@3.3.0: The engine "node" is
      #   incompatible with this module. Expected version ">=22.0.0"
      # Actions is also deprecating Node 20 on its runners. If a future
      # eas-cli dependency raises the floor again, bump this (and only this).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      # Apple requires every TestFlight upload to have a strictly higher
      # CFBundleVersion than the last one. eas.json uses
      # appVersionSource: "local", so EAS's autoIncrement bumped the number
      # in this throwaway checkout and never persisted it — every CI run
      # produced the same build number and Apple rejected the second upload
      # as a duplicate. Instead, stamp a unique, always-increasing number
      # derived from the workflow run number (and attempt, so re-runs of the
      # same run don't collide either).
      #
      # BUILD_NUMBER_BASE exists because this workflow file was deleted and
      # restored. The last build before deletion was run #53 → 5301. When a
      # workflow file is recreated, GitHub MAY continue run_number at 54 or
      # MAY restart it at 1 — the behaviour is not guaranteed, and a restart
      # would stamp 101, which Apple rejects as lower than 5301 (after a
      # ~25 min build has already burned). Adding the last-known run number
      # as a base makes the stamp safe under BOTH outcomes and monotonic
      # either way: restart → 54*100+1 = 5401; continue → 107*100+1 = 10701.
      # Both clear 5301. RESOLVED 2026-08-25: the counter CONTINUED (the first
      # run after the restore was #54), so stamps now land around 10800+. The
      # base is therefore redundant but is deliberately kept — dropping it
      # would move build numbers DOWN by ~5000, and the rule for this value is
      # only ever raise it, never lower it.
      - name: Stamp unique iOS build number
        working-directory: mobile
        env:
          BUILD_NUMBER_BASE: 53
        run: |
          BUILD_NUMBER=$(( (BUILD_NUMBER_BASE + ${{ github.run_number }}) * 100 + ${{ github.run_attempt }} ))
          jq --arg bn "$BUILD_NUMBER" '.expo.ios.buildNumber = $bn' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "Stamped expo.ios.buildNumber = $BUILD_NUMBER (base $BUILD_NUMBER_BASE + run ${{ github.run_number }})"

      # `eas build --json` puts the machine-readable result on stdout and
      # everything human — progress, warnings, and the REASON for a refusal —
      # on stderr. The original version redirected stdout to a file and let
      # stderr fall through, so a refusal ended the job on a bare
      # "Process completed with exit code 1" with the actual cause buried
      # 30 lines up. That is how the 2026-08-30 run read: the build never
      # started because the account had used its Free-plan iOS builds for the
      # month, and nothing in the job's status said so.
      #
      # So: keep stderr streaming to the job log (a 25-minute build needs live
      # progress) while also capturing it, then classify the failure. The exit
      # code travels through a file because a pipeline's status is tee's, not
      # the CLI's.
      - name: Build iOS production
        id: build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # `set +e` inside the group matters: GitHub runs this step under
          # `bash -e`, and without it the subshell dies the instant eas exits
          # non-zero — the `echo $?` never runs, and the classification below
          # reads a file that does not exist.
          { set +e
            eas build \
              --profile production \
              --platform ios \
              --non-interactive \
              --json \
              --wait > build_output.json
            echo $? > build_status
          } 2>&1 | tee build_stderr.log
          STATUS=$(cat build_status 2>/dev/null || echo 1)
          [ -n "$STATUS" ] || STATUS=1

          # Strip ANSI colour and CR so grep, the job summary and the issue
          # body all see plain text.
          sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' -e 's/\r//g' build_stderr.log > build_stderr.txt

          emit_failure() {
            # $1 = kind (quota|other), $2 = one-line reason
            {
              echo "failure_kind=$1"
              echo "failure_line=$2"
              echo 'log_tail<<BUILD_LOG_EOF'
              tail -40 build_stderr.txt
              echo ''
              echo 'BUILD_LOG_EOF'
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$STATUS" -ne 0 ]; then
            # EAS refuses over-quota builds with a line naming the plan and the
            # reset time, e.g. "This account has used its iOS builds from the
            # Free plan this month, which will reset in 1 day, 5 hours (on Tue
            # Sep 01 2026)." Match that shape loosely enough to survive wording
            # changes, and treat the upgrade hint as corroboration.
            QUOTA_RE='builds from the [A-Za-z]+ plan|reached the maximum number of builds|build limit for'
            if grep -qiE "$QUOTA_RE" build_stderr.txt \
               || grep -qiE 'eas billing:subscribe' build_stderr.txt; then
              REASON=$(grep -iE "$QUOTA_RE" build_stderr.txt | head -1)
              [ -n "$REASON" ] || REASON="EAS reported that this account is out of builds on its current plan."
              echo "::error::EAS refused the build — the account's monthly iOS build allowance is used up. $REASON"
              {
                echo '## iOS build not started — EAS build quota exhausted'
                echo ''
                echo "$REASON"
                echo ''
                echo 'No IPA was produced and nothing reached Apple. This is a plan'
                echo 'limit, not a problem with the code — re-running before the reset'
                echo 'will fail the same way.'
              } >> "$GITHUB_STEP_SUMMARY"
              emit_failure quota "$REASON"
            else
              REASON=$(grep -iE '^[[:space:]]*(Error|✖|✗)' build_stderr.txt | tail -1)
              [ -n "$REASON" ] || REASON="eas build exited $STATUS"
              echo "::error::eas build failed (exit $STATUS). $REASON"
              {
                echo '## iOS build failed'
                echo ''
                echo '```'
                tail -20 build_stderr.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              emit_failure other "$REASON"
            fi
            exit 1
          fi

          cat build_output.json
          BUILD_ID=$(jq -r '.[0].id // empty' build_output.json)
          if [ -z "$BUILD_ID" ]; then
            echo "::error::eas build reported success but build_output.json carried no build id."
            emit_failure other "eas build succeeded but returned no build id"
            exit 1
          fi
          BUILD_PAGE_URL="https://expo.dev/accounts/mjacode/projects/betting-picks/builds/${BUILD_ID}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "build_page_url=$BUILD_PAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Submit to TestFlight
        id: submit
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          attempt() {
            eas submit \
              --platform ios \
              --id "${{ steps.build.outputs.build_id }}" \
              --non-interactive \
              --wait 2>&1 | tee -a submit_output.log
          }
          if ! attempt; then
            echo "First submission attempt failed. Transient EAS submission-service"
            echo "failures surface as a generic error with no message — retrying once in 120s."
            sleep 120
            attempt
          fi

      # eas submit only prints a generic line when the submission errors
      # without a structured error payload. Pull the real story (status,
      # error code/message, submission worker logs) from the EAS GraphQL
      # API so the job log and tracking issue show the actual cause.
      - name: Fetch submission failure details
        id: submitdiag
        if: failure() && steps.submit.outcome == 'failure'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          DIAG_FILE=$(mktemp)
          SUB_IDS=$(grep -oE 'submissions/[0-9a-f-]{36}' submit_output.log | cut -d/ -f2 | sort -u)
          if [ -z "$SUB_IDS" ]; then
            echo "No submission IDs found in eas submit output — submission was never scheduled." > "$DIAG_FILE"
          fi
          for SUB_ID in $SUB_IDS; do
            {
              echo "Submission: https://expo.dev/accounts/mjacode/projects/betting-picks/submissions/${SUB_ID}"
              RESP=$(curl -sS https://api.expo.dev/graphql \
                -H "Authorization: Bearer ${EXPO_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data "{\"query\":\"query Sub(\$id: ID!) { submissions { byId(submissionId: \$id) { status error { errorCode message } logFiles } } }\",\"variables\":{\"id\":\"${SUB_ID}\"}}" || true)
              echo "$RESP" | jq -r '.data.submissions.byId
                | "Status: \(.status)\nError code: \(.error.errorCode // "none")\nError message: \(.error.message // "none — EAS returned no structured error. This is usually a transient EAS submission-service failure (check https://status.expo.dev), not an Apple rejection. Re-running the submission with the same build ID is safe.")"' \
                || echo "Could not parse submission details. Raw response: $RESP"
              for LOG_URL in $(echo "$RESP" | jq -r '.data.submissions.byId.logFiles[]?' 2>/dev/null); do
                echo "--- submission worker log (warnings/errors, last 50) ---"
                curl -sS "$LOG_URL" \
                  | jq -rR 'fromjson? | select(.level != null and .level >= 40) | .msg' \
                  | tail -50 || true
              done
              echo ""
            } >> "$DIAG_FILE" 2>&1 || true
          done
          echo "===== Submission failure details ====="
          cat "$DIAG_FILE"
          {
            echo 'details<<SUBMIT_DIAG_EOF'
            head -c 60000 "$DIAG_FILE"
            echo ''
            echo 'SUBMIT_DIAG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update TestFlight tracking issue
        if: success()
        uses: actions/github-script@v7
        env:
          BUILD_PAGE_URL: ${{ steps.build.outputs.build_page_url }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const buildPageUrl = process.env.BUILD_PAGE_URL;
            const buildId = process.env.BUILD_ID;
            const sha = (process.env.COMMIT_SHA || '').slice(0, 7);
            const now = new Date().toISOString();
            const title = 'Latest TestFlight build';
            const body = [
              '<!-- mobile-testflight-build -->',
              '## Latest TestFlight build',
              '',
              `**Build details:** ${buildPageUrl}`,
              `**Build ID:** \`${buildId}\``,
              `**From commit:** [\`${sha}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${process.env.COMMIT_SHA})`,
              `**Submitted at:** ${now}`,
              '',
              '### Next steps on your phone',
              '1. Wait 15-30 min for Apple to finish processing the build.',
              '2. Open **App Store Connect → TestFlight → iOS Builds**.',
              '   The build appears as "Processing" then "Ready to Submit".',
              '3. First time only: add yourself to an internal testing group',
              '   (TestFlight → Internal Testing → +).',
              '4. Open the **TestFlight** app on your iPhone — the new build',
              '   appears under Signalbase. Tap Install.',
              '',
              'If the build does not appear after 30 min, check the build',
              'page link above and the Activity tab in App Store Connect',
              'for an export-compliance or metadata warning.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const tag = '<!-- mobile-testflight-build -->';
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.data.find((i) => i.body && i.body.includes(tag));
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body, title,
              });
              core.info(`Updated tracking issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Created tracking issue #${created.data.number}`);
            }

      # A build that never started is a different story from a build that
      # broke, and the difference matters: the quota case needs no code change
      # and no debugging, only a date (or a plan decision that is Matt's to
      # make). Say which one happened, in the same tracking issue the success
      # and submit-failure paths write to.
      - name: Post failure note on build failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          FAILURE_KIND: ${{ steps.build.outputs.failure_kind }}
          FAILURE_LINE: ${{ steps.build.outputs.failure_line }}
          BUILD_LOG_TAIL: ${{ steps.build.outputs.log_tail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const kind = process.env.FAILURE_KIND || 'other';
            const reason = (process.env.FAILURE_LINE || '').trim()
              || 'EAS did not report a reason.';
            const tail = (process.env.BUILD_LOG_TAIL || '').trim()
              || 'No output captured — open the run log.';
            const runUrl = process.env.RUN_URL;
            const sha = (process.env.COMMIT_SHA || '').slice(0, 7);
            const { owner, repo } = context.repo;

            const quotaBody = [
              '<!-- mobile-testflight-build -->',
              '## iOS build blocked — EAS build quota exhausted',
              '',
              'EAS refused the build before it started, so **no IPA was produced and',
              'nothing reached Apple**. Nothing is wrong with the code, and re-running',
              'the workflow before the reset will fail in exactly the same way.',
              '',
              '**What EAS said**',
              '```',
              reason,
              '```',
              '',
              `**Run:** ${runUrl}`,
              `**From commit:** [\`${sha}\`](https://github.com/${owner}/${repo}/commit/${process.env.COMMIT_SHA})`,
              '',
              '### The options, in the order they are usually right',
              '1. **Is the pending change JS-only?** Then no TestFlight build is needed',
              '   at all — merging to `master` ships it over the air via the',
              '   `Mobile OTA update (production)` workflow. Only a native change',
              '   (a new native dependency, an app.json/plugin change, an SDK bump)',
              '   needs a build.',
              '2. **Wait for the monthly reset**, then press Run workflow again. The',
              '   build number is stamped from the run number, so a later run always',
              '   uploads a strictly higher `CFBundleVersion` — waiting costs nothing',
              '   and breaks nothing.',
              '3. **Upgrade the EAS plan** — a spend decision, so it is Matt\'s call,',
              '   not CI\'s. Check the current numbers at https://expo.dev/pricing',
              '   before subscribing, then from a local machine:',
              '   ```',
              '   eas billing:subscribe starter --account mjacode',
              '   ```',
              '',
              'Building the production profile locally (`eas build --local`) is *not*',
              'an option here: it needs macOS and Xcode.',
            ].join('\n');

            const otherBody = [
              '<!-- mobile-testflight-build -->',
              '## iOS build failed',
              '',
              '`eas build` failed before an IPA existed, so nothing was submitted to',
              'App Store Connect.',
              '',
              '**Reason reported**',
              '```',
              reason,
              '```',
              '',
              '**Last lines of the build output**',
              '```',
              tail,
              '```',
              '',
              `**Run:** ${runUrl}`,
              `**From commit:** [\`${sha}\`](https://github.com/${owner}/${repo}/commit/${process.env.COMMIT_SHA})`,
              '',
              'The full EAS build log (including the native compile output, which the',
              'runner never sees) is linked from',
              'https://expo.dev/accounts/mjacode/projects/betting-picks/builds.',
            ].join('\n');

            const body = kind === 'quota' ? quotaBody : otherBody;
            const title = kind === 'quota'
              ? 'iOS build blocked — EAS build quota exhausted'
              : 'iOS build failed';

            const tag = '<!-- mobile-testflight-build -->';
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.data.find((i) => i.body && i.body.includes(tag));
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body, title,
              });
              core.info(`Updated tracking issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Created tracking issue #${created.data.number}`);
            }

      - name: Post failure note on submit failure
        if: failure() && steps.build.outcome == 'success' && steps.submit.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          BUILD_PAGE_URL: ${{ steps.build.outputs.build_page_url }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          SUBMIT_DIAG: ${{ steps.submitdiag.outputs.details }}
        with:
          script: |
            const buildPageUrl = process.env.BUILD_PAGE_URL;
            const buildId = process.env.BUILD_ID;
            const diag = (process.env.SUBMIT_DIAG || '').trim()
              || 'No details captured — open the submission link in the job log.';
            const body = [
              '<!-- mobile-testflight-build -->',
              '## TestFlight submission failed',
              '',
              'The production build finished but `eas submit` could not push it to App Store Connect',
              '(the submission was retried once automatically before failing).',
              '',
              `**Build details:** ${buildPageUrl}`,
              `**Build ID:** \`${buildId}\``,
              '',
              '### What EAS reported',
              '```',
              diag,
              '```',
              '',
              '### How to resubmit (no rebuild needed — same IPA)',
              'Re-run this workflow only rebuilds from scratch; to resubmit the existing',
              'build, run from a local machine:',
              '',
              '```',
              'cd mobile',
              `eas submit --platform ios --id ${buildId} --non-interactive`,
              '```',
              '',
              '### If the error above mentions authentication / credentials',
              'The App Store Connect API key registered with EAS may be revoked or expired:',
              '',
              '```',
              'cd mobile',
              'eas credentials',
              '# → iOS → production → App Store Connect API key → Add new',
              '# upload the .p8 from https://appstoreconnect.apple.com/access/integrations/api',
              '```',
              '',
              '### If EAS returned no structured error',
              'That is the signature of a transient EAS submission-service failure —',
              'check https://status.expo.dev and resubmit with the command above.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const tag = '<!-- mobile-testflight-build -->';
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = issues.data.find((i) => i.body && i.body.includes(tag));
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body,
                title: 'TestFlight submission failed',
              });
            } else {
              await github.rest.issues.create({
                owner, repo, body, title: 'TestFlight submission failed',
              });
            }
